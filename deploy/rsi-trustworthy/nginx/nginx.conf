upstream api_upstream {
    server api:8000;
    keepalive 256;
}

log_format sandbox_timing '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                          'request_time=$request_time upstream_response_time=$upstream_response_time '
                          'upstream_connect_time=$upstream_connect_time upstream_header_time=$upstream_header_time '
                          'upstream_status=$upstream_status uri="$request_uri"';
access_log /var/log/nginx/access.log sandbox_timing;

server {
    listen 80;
    keepalive_timeout 65;
    keepalive_requests 10000;

    location / {
        return 200 'RSI Trustworthy API Gateway is running.';
    }

    location /api/v1/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 180s;
        client_max_body_size 200m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
